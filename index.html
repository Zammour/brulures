<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brûlures – recueil</title>
<meta name="description" content="Recueil en temps réel des mesures de l'étude de rinçage après brûlure lipophile sur yeux porcins ex vivo.">
<meta name="theme-color" content="#13262E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brûlures">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #EEF3F3;
  --surface: #FFFFFF;
  --surface-2: #F5F8F8;
  --ink: #13262E;
  --ink-2: #47595F;
  --muted: #6E7F84;
  --line: #D3DDDF;
  --accent: #B1245A;
  --accent-soft: #F7E3EB;
  --on-accent: #FFFFFF;
  --ok: #1F7A4D;
  --ok-soft: #E1F2E8;
  --warn: #9A5B00;
  --warn-soft: #FBEFD9;
  --g1: #2a78d6; --g2: #eb6834; --g3: #1baf7a; --g4: #7C8C91;
  --font: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-s: 8px; --r-m: 12px;
  --tap: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0D171B; --surface: #15232A; --surface-2: #1B2C34;
    --ink: #E8F0F1; --ink-2: #AFC0C4; --muted: #8597A0; --line: #2C3E46;
    --accent: #E9679A; --accent-soft: #3A1E2A; --on-accent: #1A0B11;
    --ok: #5CC28E; --ok-soft: #173326; --warn: #E7A94A; --warn-soft: #3A2C14;
    --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #8597A0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0D171B; --surface: #15232A; --surface-2: #1B2C34;
  --ink: #E8F0F1; --ink-2: #AFC0C4; --muted: #8597A0; --line: #2C3E46;
  --accent: #E9679A; --accent-soft: #3A1E2A; --on-accent: #1A0B11;
  --ok: #5CC28E; --ok-soft: #173326; --warn: #E7A94A; --warn-soft: #3A2C14;
  --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #8597A0;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 17px; line-height: 1.45;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- En-tête ---------- */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--ink); color: var(--bg);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; gap: 12px;
}
:root[data-theme="dark"] .top { background: #08100F; color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .top { background: #08100F; color: var(--ink); } }
.top h1 { font-size: 18px; font-weight: 700; margin: 0; flex: 1; letter-spacing: .01em; white-space: nowrap; }
.sync {
  border: 0; background: transparent; color: inherit; display: flex; align-items: center; gap: 8px;
  font-size: 13px; padding: 6px 0 6px 4px; min-height: 40px; cursor: pointer; text-align: right; line-height: 1.2;
}
.sync .dot { width: 10px; height: 10px; border-radius: 50%; background: #9AA7AB; flex: none; }
.sync[data-s="ok"] .dot { background: #4CC38A; }
.sync[data-s="pending"] .dot { background: #F0B44C; }
.sync[data-s="error"] .dot { background: #F07178; }
.sync[data-s="busy"] .dot { background: #8FC7FF; animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .3; } }

/* ---------- Minuteurs actifs ---------- */
.dock { position: sticky; top: calc(60px + env(safe-area-inset-top)); z-index: 19; }
.dock:empty { display: none; }
.dock a {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink);
  background: var(--accent-soft); border-bottom: 1px solid var(--line); padding: 8px 16px; font-size: 15px;
}
.dock a.due { background: var(--accent); color: var(--on-accent); }
.dock .cd { font-family: var(--mono); font-weight: 600; font-size: 18px; margin-left: auto; font-variant-numeric: tabular-nums; }

/* ---------- Structure ---------- */
main { max-width: 720px; margin: 0 auto; padding: 16px; }
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex;
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.nav a {
  flex: 1; text-align: center; padding: 10px 4px 12px; text-decoration: none; color: var(--muted);
  font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--accent); font-weight: 700; }

h2 { font-size: 24px; line-height: 1.2; margin: 4px 0 14px; font-weight: 700; }
h3 { font-size: 18px; margin: 22px 0 8px; font-weight: 700; }
h4 { font-size: 16px; margin: 16px 0 6px; font-weight: 700; color: var(--ink-2); }
p { margin: 0 0 10px; }
.hint { color: var(--muted); font-size: 15px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px 16px; margin-bottom: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.right { margin-left: auto; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 0 18px; border-radius: var(--r-s); border: 1px solid var(--line);
  background: var(--surface); font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink);
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.big { width: 100%; min-height: 60px; font-size: 19px; }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 15px; font-weight: 500; }
.btn.danger { color: #C62828; border-color: currentColor; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.btn-row .btn { flex: 1 1 140px; }

/* ---------- Champs ---------- */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 15px; color: var(--ink-2); margin-bottom: 4px; font-weight: 500; }
.field input, .field select, .field textarea {
  width: 100%; min-height: var(--tap); border: 1px solid var(--line); border-radius: var(--r-s);
  background: var(--surface-2); padding: 10px 12px; font-size: 18px;
}
.field textarea { min-height: 88px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field .unit { color: var(--muted); font-size: 15px; }
.grid2 > *, .grid3 > * { min-width: 0; }
.field input, .field select { max-width: 100%; min-width: 0; }
input[type=date] { -webkit-appearance: none; appearance: none; display: block; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
.pachy { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pachy input { width: 100%; min-width: 0; min-height: var(--tap); text-align: center; padding: 10px 2px; font-family: var(--mono); font-size: 18px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface-2); }
.pachy input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.check { display: flex; align-items: center; gap: 12px; min-height: var(--tap); font-size: 17px; cursor: pointer; }
.check input { width: 26px; height: 26px; accent-color: var(--accent); }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; margin-bottom: 12px; }
.seg label { flex: 1; text-align: center; padding: 12px 6px; cursor: pointer; background: var(--surface-2); font-weight: 500; border-right: 1px solid var(--line); }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); }

/* ---------- Groupes ---------- */
.g { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.g::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--gc, var(--g4)); }
.g[data-g="G1"] { --gc: var(--g1); } .g[data-g="G2"] { --gc: var(--g2); }
.g[data-g="G3"] { --gc: var(--g3); } .g[data-g="G4"] { --gc: var(--g4); }
.badge { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.badge.warn { white-space: normal; background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

/* ---------- Liste des yeux ---------- */
.list { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.list a { display: block; padding: 12px 16px; text-decoration: none; color: var(--ink); }
.list .l1 { display: flex; align-items: baseline; gap: 10px; }
.list .code { font-family: var(--mono); font-weight: 600; font-size: 17px; }
.list .l2 { flex-wrap: wrap; display: flex; align-items: center; gap: 10px; margin-top: 6px; color: var(--muted); font-size: 14px; }
.steps-mini { display: flex; gap: 3px; }
.steps-mini i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.steps-mini i.on { background: var(--ok); }
.steps-mini i.na { background: transparent; border: 1px dashed var(--line); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-size: 15px; cursor: pointer; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- Avancement ---------- */
.prog { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; }
.bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--gc, var(--ink-2)); border-radius: 0 4px 4px 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Fiche œil ---------- */
.eye-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.eye-head .code { font-family: var(--mono); font-size: 22px; font-weight: 600; }
.back { text-decoration: none; font-size: 15px; display: inline-flex; align-items: center; min-height: 40px; }
.stepper { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 14px; padding: 2px 16px 8px; scroll-snap-type: x proximity; }
.stepper a {
  flex: none; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink-2);
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-s); padding: 8px 12px; font-size: 15px; scroll-snap-align: start;
}
.stepper a b { font-family: var(--mono); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 13px; }
.stepper a.done b { background: var(--ok); color: #fff; }
.stepper a[aria-current="step"] { border-color: var(--ink); color: var(--ink); font-weight: 700; box-shadow: inset 0 -3px 0 var(--accent); }

/* ---------- Minuteur : l'élément fort ---------- */
.timer { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); padding: 14px 16px; margin-bottom: 12px; }
.timer .lbl { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.timer .digits {
  font-family: var(--mono); font-weight: 600; font-size: clamp(56px, 19vw, 96px); line-height: 1;
  letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 10px 0 6px; color: var(--ink);
}
.timer[data-state="run"] .digits { color: var(--accent); }
.timer[data-state="over"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.timer[data-state="over"] .digits { color: var(--on-accent); }
.timer[data-state="over"] .btn.primary { background: var(--on-accent); color: var(--accent); border-color: var(--on-accent); }
.timer[data-state="done"] .digits { font-size: 40px; color: var(--ok); }
.timer .sub { font-size: 15px; color: inherit; opacity: .85; }

/* ---------- Photo / analyse de gris ---------- */
.photo { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.photo img { width: 96px; height: 96px; object-fit: cover; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface-2); }
.analyzer canvas { width: 100%; height: auto; border-radius: var(--r-s); touch-action: none; background: #000; display: block; }
.analyzer .res { font-family: var(--mono); font-size: 28px; font-weight: 600; }

/* ---------- Tableaux & graphiques ---------- */
.tbl-wrap { overflow-x: auto; margin: 0 -4px 10px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 700; font-size: 14px; }
td { font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-2); font-family: var(--font); font-size: 12px; }
.chart .axis { stroke: var(--line); }
.chart .grid { stroke: var(--line); stroke-dasharray: 2 3; }
.chart .dot { stroke: var(--surface); stroke-width: 2; cursor: pointer; }
.chart .mean { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
.chart .sdl { stroke: var(--ink); stroke-width: 1.5; }
.chart-cap { font-size: 14px; color: var(--ink-2); min-height: 20px; }
.result { border-left: 4px solid var(--ink); padding: 6px 0 6px 12px; margin: 8px 0; }
.result.sig { border-left-color: var(--accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; margin: 6px 0; }

/* ---------- Divers ---------- */
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 14px 16px; border-radius: var(--r-m); font-weight: 500;
  max-width: 560px; margin: 0 auto; box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
.toast.alarm { background: var(--accent); color: var(--on-accent); font-size: 18px; font-weight: 700; }
.banner { background: var(--warn-soft); color: var(--warn); padding: 10px 16px; font-size: 15px; }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 500; }
.sep { height: 1px; background: var(--line); margin: 14px 0; border: 0; }
details.panel > summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
.sample { border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px 2px; margin-bottom: 10px; background: var(--surface-2); }
.sample .field input, .sample .field select { background: var(--surface); }
.big-res { font-family: var(--mono); font-size: 40px; font-weight: 600; line-height: 1.1; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 560px) { .grid3-wide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 12px; } }
</style>
</head>
<body>
<header class="top">
  <h1>Brûlures</h1>
  <button class="sync" id="sync" data-act="sync" data-s="off" aria-live="polite"><span id="sync-txt">Synchro non configurée</span><span class="dot"></span></button>
</header>
<div id="banner"></div>
<div class="dock" id="dock"></div>
<main id="main" tabindex="-1"><p class="empty">Chargement…</p></main>
